name: Build RESPAWN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 37
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RESPAWN_FINANZAS_0.9.1.apk
          sha256sum dist/RESPAWN_FINANZAS_0.9.1.apk > dist/RESPAWN_FINANZAS_0.9.1.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RESPAWN_FINANZAS_0.9.1_APK
          path: |
            dist/RESPAWN_FINANZAS_0.9.1.apk
            dist/RESPAWN_FINANZAS_0.9.1.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.1
          name: RESPAWN Finanzas v0.9.1
          target_commitish: main
          generate_release_notes: true
          files: |
            dist/RESPAWN_FINANZAS_0.9.1.apk
            dist/RESPAWN_FINANZAS_0.9.1.apk.sha256
