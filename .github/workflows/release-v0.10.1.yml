name: Release BURACO 0.10.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.10.1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 37
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BURACO_0.10.1.apk
          sha256sum dist/BURACO_0.10.1.apk > dist/BURACO_0.10.1.apk.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.10.1 \
            dist/BURACO_0.10.1.apk \
            dist/BURACO_0.10.1.apk.sha256 \
            --title "BURACO 0.10.1" \
            --notes "Pulido específico do tema claro Ivory. O fondo deixa de ter o aspecto gris e pesado e pasa a un marfil limpo con profundidade moi sutil; as superficies son branco cálido, as sombras baixan de intensidade, os bordes son máis finos e neutros e as cores dourado/oliva, verde e vermello quedan máis sobrias. KPIs, cards, documentos, badges e overlays adaptan agora a elevación segundo sexa tema claro ou escuro. Mantense intacta toda a lóxica e os datos da 0.10.0."
